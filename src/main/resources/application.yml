# ============================================================
# Spring Boot 公共配置（所有环境共享）
# 环境相关的数据库配置已拆到 application-{env}.yml
# ============================================================

# 默认激活 dev 环境：本地直接启动就连本地库，无需额外参数
# 排查其他环境时覆盖它：--spring.profiles.active=sit
spring:
  profiles:
    active: dev

  # Flyway 数据库迁移：应用启动时自动执行 classpath:db/migration 下的版本化 SQL
  # 作用：再也不会出现“忘了跑 init.sql 导致表不存在”的报错
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 现有库已有 user/product 表但还没有 flyway 版本记录，
    # 必须设为 true 才能初始化 history 表并接管已有表（空库首次部署不受影响，会正常执行 V1/V2）
    baseline-on-migrate: true

server:
  # 后端端口，前端 dev 代理 /api -> 8080
  port: 8080

mybatis-plus:
  configuration:
    # 打印执行的 SQL 到控制台，方便排查；生产环境建议注释掉（性能/安全）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增（配合表里 id AUTO_INCREMENT）
      id-type: auto

logging:
  level:
    # 本项目日志设为 debug，能看到更多细节
    com.example.userserver: debug

# ============================================================
# 多环境怎么加（不用改本文件）：
#   1. application-dev.yml   -> 本地开发库（已存在）
#   2. application-sit.yml   -> 测试环境库，密码用环境变量，别写死
#   3. application-uat.yml   -> 验收环境库（复制 sit 改地址即可）
# 切换环境：启动时加 --spring.profiles.active=sit
# ============================================================
