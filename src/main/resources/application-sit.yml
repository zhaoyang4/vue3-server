# ============================================================
# 测试环境（SIT）
# 使用方法：
#   1. 数据库地址、账号、密码全部通过环境变量传入（下面没有默认值的就是必填）
#   2. 密码绝不写死在文件里，避免提交到 Git 泄露
#   3. 启动示例（PowerShell）：
#        $env:SPRING_PROFILES_ACTIVE="sit"
#        $env:DB_HOST="10.0.0.31"; $env:DB_NAME="vue3_user_sit"
#        $env:DB_USERNAME="sit_user"; $env:DB_PASSWORD="实际密码"
#        java -jar target/vue3-server-1.0.0.jar
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:vue3_user_sit}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:sit_user}
    # 从环境变量读取，绝不写死密码；没设会直接启动失败（这是好事：早失败早发现）
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    # 测试环境保留 SQL 打印，方便联调排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.userserver: debug
