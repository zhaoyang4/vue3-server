# ============================================================
# 测试环境（SIT）模板示例
# 使用方法：
#   1. 把 <sit-host> 换成 sit 数据库的真实 IP/域名
#   2. 密码不要写死在这里！用环境变量传入，避免提交到 Git 泄露
#   3. 启动前先设置环境变量： $env:SIT_DB_PASSWORD="实际密码"
#   4. 启动时切换环境： mvnw.cmd spring-boot:run "-Dspring-boot.run.arguments=--server.port=8080 --spring.profiles.active=sit"
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://<sit-host>:3306/vue3_user_sit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: sit_user
    # 从环境变量读取，绝不写死密码
    password: ${SIT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
