# ============================================================
# 一键编排「MySQL + 后端 + 前端 Nginx」三个容器
#
# 用法：
#   1. cp .env.example .env   然后填好里面的密码（.env 已被 .gitignore 忽略，不会进仓库）
#   2. docker compose up -d --build
#   3. 浏览器打开 http://服务器IP        （前端）
#      curl http://服务器IP/actuator/health  （整链路探活）
#   停止：docker compose down          （加 -v 会连数据库数据一起删，慎用）
#   看日志：docker compose logs -f backend
#
# 目录假设：前端项目 vue3 与后端项目 vue3-server 同级摆放
#   space/
#     ├── vue3/          <- 前端（含 Dockerfile、nginx.conf）
#     └── vue3-server/   <- 后端（含本文件）
#   若前端在别处，在 .env 里改 FRONTEND_DIR
# ============================================================

services:

  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: vue3-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 首次启动时自动建库 + 建应用账号（应用不用 root 连库，权限最小化）
      MYSQL_DATABASE: ${DB_NAME:-vue3_user}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      # ★ 只绑定宿主机 127.0.0.1：公网连不上 3306，只有本机/容器内可访问
      #   （对应"3306 只开内网"的安全要求。完全不需要外部连库时可以整段删掉）
      - "127.0.0.1:${MYSQL_LOCAL_PORT:-3306}:3306"
    volumes:
      # 命名卷持久化数据：容器删了数据还在
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [vue3-net]

  # ---------------- 后端 ----------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vue3-server:latest
    container_name: vue3-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB_HOST 写服务名 mysql：Docker 内置 DNS 会解析到 MySQL 容器
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vue3_user}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 前端由本编排里的 Nginx 同域代理，正常不会触发跨域；填上是给"直连后端"的场景兜底
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        # 等 MySQL 真正健康了再启动，避免"启动太快连不上库"直接崩
        condition: service_healthy
    ports:
      # 默认只在宿主本机暴露 8080（前端 Nginx 走容器网络访问，无需公网端口）
      # 想让前端直连后端 IP 调试，改成 "8080:8080" 并在安全组放行 8080
      - "127.0.0.1:${BACKEND_LOCAL_PORT:-8080}:8080"
    volumes:
      # 日志落到宿主机，方便 tail 排查（容器重建也不丢）
      - ./logs:/app/logs
    networks: [vue3-net]

  # ---------------- 前端（Nginx 托管静态页 + 反代 /api）----------------
  frontend:
    build:
      # 前端项目目录，默认取同级的 ../vue3
      context: ${FRONTEND_DIR:-../vue3}
      dockerfile: Dockerfile
      args:
        # 构建期注入：/api 表示走本容器 Nginx 反代到 backend，浏览器视角同源不跨域
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    image: vue3-web:latest
    container_name: vue3-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    ports:
      # 对外的唯一入口。云安全组只需放行这一个端口
      - "${WEB_PORT:-80}:80"
    networks: [vue3-net]

volumes:
  mysql-data:

networks:
  vue3-net:
    driver: bridge
